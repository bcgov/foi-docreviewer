services:
  worker:
    build: .
    container_name: pdf_preprocessing_worker
    ports:
      - "8000:8000"
    # Everything the app + boto3 need (S3_ENDPOINT_URL, S3_FORCE_PATH_STYLE,
    # OUTPUT_FILENAME_SUFFIX, AWS_* credentials, LOG_LEVEL, ...) comes from .env,
    # loaded straight into the container. The `environment:` block below only
    # holds values that MUST differ inside the compose network.
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_STREAM_URL: redis://:redis@redis:6379/1
      HEALTH_PORT: 8000
      WORK_DIR: /tmp/pdf-preprocessing
      JSON_LOGS: "true"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7
    container_name: pdf_preprocessing_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass "redis"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
