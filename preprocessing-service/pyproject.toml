[tool.poetry]
name = "pdf-preprocessing"
version = "0.0.1"
description = "detect clip-hidden text in PDFs (invisible text), re-draw it, publish the result for the next service."
authors = ["alvesfc <alvesfc@prootnmail.com>"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"

# --- Redis ---
redis = "^7.1.0"

# --- PDF processing ---
pymupdf = "^1.26.0"

# --- S3 (source + restored PDF storage) ---
boto3 = "^1.36.0"

# --- Config ---
pydantic-settings = "^2.12.0"

# --- Utilities ---
python-dotenv = "^1.2.1"

# Optional: Logging/Tracing
structlog = "^25.5.0"
opentelemetry-api = "^1.38.0"
opentelemetry-sdk = "^1.38.0"
opentelemetry-exporter-otlp = "^1.38.0"
opentelemetry-instrumentation-logging = "^0.59b0"
opentelemetry-semantic-conventions = "^0.59b0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.1"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
ruff = "^0.14.6"
black = "^25.11.0"
testcontainers = { extras = ["redis"], version = "^4.9.0" }
moto = { extras = ["s3"], version = "^5.0.0" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# -----------------------------
# Formatting & Linting (Optional)
# -----------------------------

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires Docker (Redis testcontainer)",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
