---
kind: Template
apiVersion: template.openshift.io/v1
metadata:
  annotations:
    description: Deployment template for a dedupe service.
    tags: "${APP_NAME}"
  name: "${APP_NAME}-deploy"
objects:
- kind: DeploymentConfig
  apiVersion: v1
  metadata:
    name: "${APP_NAME}"
    labels:
      app: "${APP_NAME}"
      app-group: "${APP_GROUP}"
      template: "${APP_NAME}-deploy"
  spec:
    strategy:
      type: Rolling
      rollingParams:
        updatePeriodSeconds: 1
        intervalSeconds: 1
        timeoutSeconds: 600
        maxUnavailable: 25%
        maxSurge: 25%
    triggers:
    - type: ImageChange
      imageChangeParams:
        automatic: true
        containerNames:
        - "${APP_NAME}"
        from:
          kind: ImageStreamTag
          namespace: "${IMAGE_NAMESPACE}"
          name: "${IMAGE_NAME}:${TAG_NAME}"
    - type: ConfigChange
    replicas: 1
    test: false
    selector:
      app: "${APP_NAME}"
      deploymentconfig: "${APP_NAME}"
    template:
      metadata:
        labels:
          app: "${APP_NAME}"
          app-group: "${APP_GROUP}"
          deploymentconfig: "${APP_NAME}"
          template: "${APP_NAME}-deploy"
      spec:
        containers:
        - name: "${APP_NAME}"
          image: "${APP_NAME}"
          imagePullPolicy: Always
          env:
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: "${SECRETS}"
                  key: REDIS_HOST
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "${SECRETS}"
                  key: REDIS_PASSWORD
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: "${SECRETS}"
                  key: REDIS_PORT
            - name: COMPRESSION_MESSAGING_MODE
              value: "${COMPRESSION_MESSAGING_MODE}"
            - name: MESSAGING_STREAM_PREFIX
              value: "${MESSAGING_STREAM_PREFIX}"
            - name: COMPRESSION_TOPIC
              value: "${COMPRESSION_TOPIC}"
            - name: COMPRESSION_WORKLOAD
              value: "${COMPRESSION_WORKLOAD}"
            - name: DEDUPE_CONSUMER_GROUP
              value: "${DEDUPE_CONSUMER_GROUP}"
            - name: DEDUPE_CONSUMER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DEDUPE_CONSUMER_BATCH_SIZE
              value: "${DEDUPE_CONSUMER_BATCH_SIZE}"
            - name: DEDUPE_CONSUMER_BLOCK_MS
              value: "${DEDUPE_CONSUMER_BLOCK_MS}"
            - name: DEDUPE_CONSUMER_MAX_RETRIES
              value: "${DEDUPE_CONSUMER_MAX_RETRIES}"
            - name: DEDUPE_CONSUMER_RETRY_BACKOFF_MS
              value: "${DEDUPE_CONSUMER_RETRY_BACKOFF_MS}"
            - name: DEDUPE_CONSUMER_CLAIM_MIN_IDLE_MS
              value: "${DEDUPE_CONSUMER_CLAIM_MIN_IDLE_MS}"
            - name: DEDUPE_DLQ_STREAM
              value: "${DEDUPE_DLQ_STREAM}"
            - name: DEDUPE_DLQ_MAXLEN
              value: "${DEDUPE_DLQ_MAXLEN}"
            # Required while the rollout-safe default remains legacy mode.
            - name: COMPRESSION_STREAM_KEY
              valueFrom:
                secretKeyRef:
                  name: "${SECRETS}"
                  key: COMPRESSION_STREAM_KEY_LARGEFILES
            - name: DEDUPE_STREAM_KEY
              valueFrom:
                secretKeyRef:
                  name: "${SECRETS}"
                  key: DEDUPE_STREAM_KEY_LARGEFILES
            - name: NOTIFICATION_STREAM_KEY
              valueFrom:
                secretKeyRef:
                  name: "${SECRETS}"
                  key: NOTIFICATION_STREAM_KEY
            - name: DEDUPE_S3_ENV
              valueFrom:
                secretKeyRef:
                  name: "${SECRETS}"
                  key: DEDUPE_S3_ENV
            - name: DEDUPE_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: "${SECRETS}"
                  key: DEDUPE_DB_HOST
            - name: DEDUPE_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: "${SECRETS}"
                  key: DEDUPE_DB_NAME
            - name: DEDUPE_DB_PORT
              valueFrom:
                secretKeyRef:
                  name: "${SECRETS}"
                  key: DEDUPE_DB_PORT
            - name: DEDUPE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: "${DB_SECRETS}"
                  key: app-db-username
            - name: DEDUPE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "${DB_SECRETS}"
                  key: app-db-password
            - name: DEDUPE_S3_HOST
              valueFrom:
                secretKeyRef:
                  name: "${SECRETS}"
                  key: DEDUPE_S3_HOST
            - name: DEDUPE_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: "${SECRETS}"
                  key: DEDUPE_S3_REGION
            - name: DEDUPE_S3_SERVICE
              valueFrom:
                secretKeyRef:
                  name: "${SECRETS}"
                  key: DEDUPE_S3_SERVICE
          resources:
            requests:
              cpu: "50m"
              memory: "250Mi"
            limits:
              cpu: "150m"
              memory: "500Mi"
          terminationMessagePath: "/dev/termination-log"
          terminationMessagePolicy: File
          imagePullPolicy: Always
        restartPolicy: Always
        terminationGracePeriodSeconds: 30
        dnsPolicy: ClusterFirst
        securityContext: {}
        schedulerName: default-scheduler
  # status:
  #   loadBalancer: {}
parameters:
- name: APP_NAME
  displayName: Name
  description: The name assigned to all of the OpenShift resources associated to the
    server instance.
  required: true
  value: reviewer-dedupe-largefiles
- name: APP_GROUP
  displayName: App Group
  description: The name assigned to all of the deployments in this project.
  required: true
  value: foi-docreviewer
- name: IMAGE_NAMESPACE
  displayName: Image Namespace
  required: true
  description: The namespace of the OpenShift project containing the imagestream for
    the application.
- name: IMAGE_NAME
  displayName: Name
  description: The name assigned to all of the OpenShift resources associated to the
    server instance.
  required: true
- name: TAG_NAME
  displayName: Environment TAG name
  description: The TAG name for this environment, e.g., dev, test, prod
  required: true
- name: DB_SECRETS
  displayName: Patroni DB Secrets
  description: Name of secrets for all db values
  required: true
- name: SECRETS
  displayName: Dedupe Secrets
  description: Name of secrets for all dedupe values
  required: true
- name: COMPRESSION_MESSAGING_MODE
  displayName: Compression Messaging Mode
  description: Use legacy during rollout; set standard only for the staged cutover.
  required: true
  value: legacy
- name: MESSAGING_STREAM_PREFIX
  displayName: Messaging Stream Prefix
  description: Prefix for standard Redis Streams topics.
  required: true
  value: foi
- name: COMPRESSION_TOPIC
  displayName: Compression Topic
  description: Standard Redis Streams topic for large-file Dedupe processing.
  required: true
  value: compression-large
- name: COMPRESSION_WORKLOAD
  displayName: Compression Workload
  description: Workload classification recorded for compression jobs.
  required: true
  value: large
- name: DEDUPE_CONSUMER_GROUP
  displayName: Dedupe Consumer Group
  description: Redis stream consumer group for dedupe delivery.
  required: true
  value: dedupe
- name: DEDUPE_CONSUMER_BATCH_SIZE
  displayName: Dedupe Consumer Batch Size
  description: Maximum dedupe messages read per consumer poll.
  required: true
  value: "10"
- name: DEDUPE_CONSUMER_BLOCK_MS
  displayName: Dedupe Consumer Block Milliseconds
  description: Long poll duration for dedupe consumer reads.
  required: true
  value: "5000"
- name: DEDUPE_CONSUMER_MAX_RETRIES
  displayName: Dedupe Consumer Max Retries
  description: Maximum retry attempts before routing to the DLQ.
  required: true
  value: "5"
- name: DEDUPE_CONSUMER_RETRY_BACKOFF_MS
  displayName: Dedupe Consumer Retry Backoff Milliseconds
  description: Delay between dedupe retry attempts.
  required: true
  value: "250"
- name: DEDUPE_CONSUMER_CLAIM_MIN_IDLE_MS
  displayName: Dedupe Consumer Claim Minimum Idle Milliseconds
  description: Minimum idle time before claiming a pending dedupe message.
  required: true
  value: "60000"
- name: DEDUPE_DLQ_STREAM
  displayName: Dedupe Dead Letter Stream
  description: Redis stream used for permanently failed dedupe messages.
  required: true
  value: foi:dedupe.dlq
- name: DEDUPE_DLQ_MAXLEN
  displayName: Dedupe Dead Letter Stream Max Length
  description: Approximate maximum number of entries retained in the dedupe DLQ stream.
  required: true
  value: "10000"
