name: ZippingServices Tests

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'computingservices/ZippingServices/**'
      - '.github/workflows/zippingservices-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build paired production images and validate as app_user
        shell: bash
        run: |
          set -euo pipefail
          service=computingservices/ZippingServices
          docker pull python:3.13-bookworm
          docker image inspect python:3.13-bookworm --format '{{json .RepoDigests}}'
          for dockerfile in Dockerfile Dockerfile.local; do
            image="reviewer-zippingservice:${dockerfile,,}"
            docker build --no-cache -t "$image" -f "$service/$dockerfile" "$service"
            docker run --rm --entrypoint python "$image" -m pip check
            docker run --rm --entrypoint python "$image" integrationtests/runtime_smoke.py
            docker build -t "$image-tests" --build-arg "CANDIDATE=$image" \
              -f "$service/integrationtests/build-test-image.Dockerfile" "$service"
            docker run --rm --entrypoint sh "$image-tests" -ec '
              python -m pip check
              python -m pytest --collect-only -q -p no:cacheprovider unittests
              python -m pytest -q -p no:cacheprovider --junitxml=/tmp/results.xml unittests
              python integrationtests/check-results.py /tmp/results.xml
            '
          done
          docker save reviewer-zippingservice:dockerfile-tests \
            reviewer-zippingservice:dockerfile.local-tests | gzip > /tmp/zipper-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: zipper-tested-images
          path: /tmp/zipper-images.tar.gz
          retention-days: 1

  isolated-pipeline:
    needs: candidate-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zipper-tested-images
          path: /tmp
      - name: Independently inspect stored archives, job state and restart
        shell: bash
        run: |
          set -euo pipefail
          docker load -i /tmp/zipper-images.tar.gz
          for image in dockerfile dockerfile.local; do
            bash computingservices/ZippingServices/integrationtests/run-isolated.sh \
              "reviewer-zippingservice:$image-tests"
          done
