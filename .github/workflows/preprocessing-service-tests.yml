name: Preprocessing Service Tests

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - preprocessing-service/**
      - .github/workflows/preprocessing-service-tests.yml
  push:
    branches:
      - dev
      - main
    paths:
      - preprocessing-service/**
      - .github/workflows/preprocessing-service-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preprocessing-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.2.1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run unit tests
        run: poetry run pytest -m 'not integration'

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preprocessing-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.2.1

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Verify Docker is available for Testcontainers
        run: docker version

      - name: Run integration tests
        run: poetry run pytest -m integration
